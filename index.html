<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Tap Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a153b;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 15px;
            border-radius: 12px;
            text-align: center;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .score-box {
            font-size: 36px;
            font-weight: bold;
            color: #d8b4fe;
            margin: 5px 0;
        }
        .dialogue-box {
            background: rgba(147, 51, 234, 0.2);
            border: 1px solid #a855f7;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            margin: 8px 0;
            animation: pulse 2s infinite;
            text-align: center;
            max-width: 85%;
        }
        .waifu-container {
            position: relative;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            max-height: 50vh;
        }
        .waifu-container img {
            max-height: 42vh;
            width: auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.3);
            transition: transform 0.1s ease;
        }
        .waifu-container img:active {
            transform: scale(0.96);
        }
        /* Efeito de corações flutuantes ao tocar */
        .heart {
            position: absolute;
            color: #ff6584;
            font-size: 24px;
            font-weight: bold;
            animation: floatUp 1s ease-out forwards;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-80px) scale(1.5); opacity: 0; }
        }
        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: #110d26;
            width: 100%;
            padding: 12px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .nav-item {
            text-align: center;
            font-size: 11px;
            color: #9ca3af;
        }
        .nav-item.active {
            color: #ec4899;
        }
    </style>
</head>
<body>

    <div class="header">
        <div id="user-info" style="font-size: 13px; color: #a78bfa;">A carregar...</div>
        <div class="score-box" id="score">0</div>
        <div style="font-size: 11px; color: #9ca3af;">WAIFU POINTS</div>
        <div class="dialogue-box" id="dialogue">"Olá! Toca em mim para começarmos!"</div>
    </div>

    <div class="waifu-container" id="tap-area">
        <img src="waifu.png" alt="Waifu">
    </div>

    <div style="width: 90%; margin-bottom: 10px;">
        <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px;">
            <span>⚡ Energia</span>
            <span id="energy-text">100 / 100</span>
        </div>
        <div style="background: rgba(255,255,255,0.1); height: 6px; border-radius: 3px; overflow: hidden;">
            <div id="energy-bar" style="background: #10b981; width: 100%; height: 100%; transition: width 0.2s;"></div>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active">❤️<br>Waifu</div>
        <div class="nav-item">⚡<br>Loja</div>
        <div class="nav-item">🏆<br>Ranking</div>
        <div class="nav-item">👥<br>Amigos</div>
    </div>

    <script>
        let points = 0;
        let energy = 100;
        let userName = "Utilizador";

        // Puxar o nome real do Telegram se disponível
        const tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userName = tg.initDataUnsafe.user.first_name;
        }
        document.getElementById('user-info').innerText = `${userName} • Nível 1 • Waifu Master`;

        // Lista de frases dinâmicas para a pessoa
        const welcomePhrases = [
            `Que bom ver-te por aqui, ${userName}!`,
            `Estava a saudades tua, ${userName}! Vamos farmar?`,
            `Força com isso, ${userName}! O topo é nosso!`,
            `Tens mãos rápidas hoje, ${userName}?`,
            `Pronta para te dar sorte hoje, ${userName}!`
        ];

        const clickPhrases = [
            "Isso mesmo, continua a focar!",
            "Adoro quando me dás atenção!",
            "Mais um ponto para a nossa conta!",
            "Estás a ir com excelente ritmo!",
            "Não pares agora, estamos quase no topo!"
        ];

        // Escolher frase inicial aleatória
        document.getElementById('dialogue').innerText = `"${welcomePhrases[Math.floor(Math.random() * welcomePhrases.length)]}"`;

        const tapArea = document.getElementById('tap-area');
        const scoreDisplay = document.getElementById('score');
        const dialogueDisplay = document.getElementById('dialogue');
        const energyBar = document.getElementById('energy-bar');
        const energyText = document.getElementById('energy-text');

        // Sistema de cliques e interatividade
        tapArea.addEventListener('click', (e) => {
            if (energy > 0) {
                points += 1;
                energy -= 1;
                scoreDisplay.innerText = points;
                
                // Atualizar barra de energia
                energyBar.style.width = energy + '%';
                energyText.innerText = energy + ' / 100';

                // Mudar frase a cada 5 cliques de forma divertida
                if (points % 5 === 0) {
                    const randomClickPhrase = clickPhrases[Math.floor(Math.random() * clickPhrases.length)];
                    dialogueDisplay.innerText = `"${randomClickPhrase}"`;
                }

                // Criar coração flutuante no local do toque
                createHeart(e);
            }
        });

        // Regenerar energia passivamente com o tempo
        setInterval(() => {
            if (energy < 100) {
                energy += 2;
                if (energy > 100) energy = 100;
                energyBar.style.width = energy + '%';
                energyText.innerText = energy + ' / 100';
            }
        }, 1000);

        function createHeart(event) {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            
            // Obter coordenadas do clique relativas à área
            const rect = tapArea.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            
            heart.style.left = x + 'px';
            heart.style.top = y + 'px';
            
            tapArea.appendChild(heart);
            
            // Remover elemento após a animação terminar
            setTimeout(() => {
                heart.remove();
            }, 1000);
        }
    </script>
</body>
</html>
