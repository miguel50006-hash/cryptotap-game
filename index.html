<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CryptoTap - Waifu Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header {
            width: 100%;
            max-width: 400px;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }
        .user-info {
            text-align: left;
        }
        .user-name {
            font-size: 0.85rem;
            font-weight: 700;
            color: #38bdf8;
        }
        .user-level {
            font-size: 0.65rem;
            color: #c084fc;
        }
        .score-board {
            margin: 0;
            z-index: 10;
        }
        #score {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #38bdf8, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(244, 114, 182, 0.4);
            letter-spacing: 1px;
            line-height: 1.1;
        }
        .score-label {
            font-size: 0.65rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .character-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto 0;
            width: 100%;
            height: 34vh;
            cursor: pointer;
        }
        
        .waifu-img {
            max-height: 100%;
            max-width: 85vw;
            object-fit: contain;
            filter: drop-shadow(0 10px 25px rgba(192, 132, 252, 0.5));
            transition: transform 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
            border-radius: 16px;
        }
        .waifu-img:active {
            transform: scale(0.94);
        }

        .music-player-bar {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 5px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            font-size: 0.7rem;
            margin-bottom: 6px;
            z-index: 10;
        }
        .music-btn {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 3px 8px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .content-panel {
            width: 100%;
            max-width: 400px;
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 6px;
            max-height: 40vh;
            overflow-y: auto;
            z-index: 10;
        }
        .content-panel.active {
            display: flex;
        }
        
        .upgrades-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            width: 100%;
        }
        .upgrade-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .upgrade-card h4 {
            margin: 0 0 4px 0;
            font-size: 0.7rem;
            color: #cbd5e1;
        }
        .upgrade-card button {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: none;
            color: white;
            padding: 6px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
        }
        .upgrade-card.ad-card {
            border-color: rgba(16, 185, 129, 0.4);
            background: rgba(6, 95, 70, 0.35);
        }
        .upgrade-card.ad-card button {
            background: linear-gradient(135deg, #059669, #047857);
            box-shadow: 0 4px 10px rgba(5, 150, 105, 0.3);
        }

        .footer-section {
            width: 100%;
            max-width: 400px;
            margin-bottom: 6px;
            z-index: 10;
        }
        .energy-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #94a3b8;
            margin-bottom: 3px;
            font-weight: 600;
        }
        .energy-bar {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 10px;
            overflow: hidden;
            height: 12px;
            border: 2px solid rgba(51, 65, 85, 0.8);
        }
        #energy-fill {
            background: linear-gradient(90deg, #10b981, #34d399);
            height: 100%;
            width: 100%;
            transition: width 0.2s linear;
            border-radius: 6px;
        }

        .nav-bar {
            width: 100%;
            max-width: 400px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            display: flex;
            justify-content: space-around;
            padding: 6px 4px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .nav-item {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 0.65rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-item span {
            font-size: 1.1rem;
        }
        .nav-item.active {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
        }

        .floating-text {
            position: absolute;
            font-weight: 900;
            color: #f472b6;
            font-size: 1.8rem;
            pointer-events: none;
            animation: floatUp 0.7s ease-out forwards;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            z-index: 100;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            50% { transform: translateY(-30px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-70px) scale(1); }
        }

        .modal-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }
        .modal-list li {
            display: flex;
            justify-content: space-between;
            padding: 6px 10px;
            background: rgba(30, 41, 59, 0.6);
            margin-bottom: 5px;
            border-radius: 6px;
            font-size: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .section-title {
            font-size: 0.85rem;
            color: #38bdf8;
            margin: 0 0 6px 0;
            text-align: left;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">
            <div class="user-name" id="user-greeting">CryptoUser</div>
            <div class="user-level">Nível 1 • Waifu Master</div>
        </div>
        <button class="upgrade-card" style="padding: 4px 8px; width: auto;" onclick="claimDailyBonus()">🎁 Bónus</button>
    </div>

    <div class="score-board">
        <div id="score">0</div>
        <div class="score-label">Waifu Points</div>
    </div>

    <!-- ABA 1: JOGO PRINCIPAL -->
    <div id="tab-game" class="content-panel active">
        <div class="character-container" id="container" onclick="handleClick(event)">
            <img id="waifu-avatar" class="waifu-img" src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=600&auto=format&fit=crop" alt="Anime Waifu 3D">
        </div>
    </div>

    <div id="tab-upgrades" class="content-panel">
        <h3 class="section-title">⚡ Loja de Melhorias</h3>
        <div class="upgrades-grid">
            <div class="upgrade-card">
                <h4>⚡ Max Energia</h4>
                <button onclick="buyMaxEnergyUpgrade()">Comprar (<span id="cost-energy">100</span>)</button>
            </div>
            <div class="upgrade-card">
                <h4>🤖 Auto-Clicker</h4>
                <button onclick="buyAutoClicker()">Comprar (<span id="cost-auto">150</span>)</button>
            </div>
            <div class="upgrade-card ad-card" style="grid-column: span 2;">
                <h4>📺 Ver Vídeo Adsgram (+Energia Total)</h4>
                <button onclick="watchAdForEnergy()">Assistir Anúncio</button>
            </div>
        </div>
    </div>

    <div id="tab-ranking" class="content-panel">
        <h3 class="section-title">🏆 Top Jogadores</h3>
        <ul id="ranking-list" class="modal-list">
            <li>A carregar ranking...</li>
        </ul>
    </div>

    <div id="tab-friends" class="content-panel">
        <h3 class="section-title">👥 Convites & Amigos</h3>
        <div class="upgrade-card" style="padding: 12px;">
            <h4 style="font-size: 0.8rem; color: #fff; margin-bottom: 6px;">Convida amigos e ganhem +50 pontos!</h4>
            <button onclick="inviteFriend()" style="background: linear-gradient(135deg, #0284c7, #0369a1);">Convidar Amigo</button>
        </div>
    </div>

    <div class="music-player-bar">
        <span>🎵 <span id="track-name">Cyber Phonk Beat (OST 1)</span></span>
        <button class="music-btn" onclick="nextTrack()">Próxima ⏭</button>
    </div>

    <div class="footer-section">
        <div class="energy-info">
            <span>⚡ Energia</span>
            <span id="energy-text">100 / 100</span>
        </div>
        <div class="energy-bar">
            <div id="energy-fill"></div>
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('game', this)"><span>💖</span>Waifu</button>
        <button class="nav-item" onclick="switchTab('upgrades', this)"><span>⚡</span>Loja</button>
        <button class="nav-item" onclick="switchTab('ranking', this)"><span>🏆</span>Ranking</button>
        <button class="nav-item" onclick="switchTab('friends', this)"><span>👥</span>Amigos</button>
    </div>

    <audio id="click-sound" src="https://www.myinstants.com/media/sounds/anime-waifu-sound.mp3" preload="auto"></audio>
    <audio id="bg-music" loop preload="auto"></audio>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyClU25mMR82D2j14DDvGvuMsfz74WDh6kU",
            authDomain: "cryptotapgame.firebaseapp.com",
            projectId: "cryptotapgame",
            storageBucket: "cryptotapgame.firebasestorage.app",
            messagingSenderId: "766236741548",
            appId: "1:766236741548:web:82723606849531f52e7409"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        let adController = null;
        try {
            if (window.Adsgram) {
                adController = window.Adsgram.init({ blockId: "int-47729" });
            }
        } catch (e) {
            console.warn("Adsgram init warning:", e);
        }

        let tg = window.Telegram.WebApp;
        tg.expand(); 

        let userId = "guest_user";
        let userName = "CryptoUser";

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = String(tg.initDataUnsafe.user.id);
            userName = tg.initDataUnsafe.user.first_name;
            document.getElementById("user-greeting").innerText = userName;
        }

        let score = 0;
        let energy = 100;
        let maxEnergy = 100;
        let maxEnergyCost = 100;
        let autoClickerCost = 150;
        let autoClickerLevel = 0;
        let lastDailyClaim = "";

        // Nova playlist enérgica e motivadora para manter o ritmo do jogador alto!
        const playlist = [
            { name: "Cyber Phonk Beat (OST 1)", src: "https://commondatastorage.googleapis.com/codeskulptor-assets/jump.ogg" },
            { name: "Electro House Hype (OST 2)", src: "https://commondatastorage.googleapis.com/codeskulptor-assets/week7-bounce.ogg" },
            { name: "Arcade Power Synth (OST 3)", src: "https://commondatastorage.googleapis.com/codeskulptor-assets/galactic_theme.ogg" }
        ];
        let currentTrackIndex = 0;
        const bgMusic = document.getElementById("bg-music");

        function playMusic() {
            bgMusic.src = playlist[currentTrackIndex].src;
            document.getElementById("track-name").innerText = playlist[currentTrackIndex].name;
            bgMusic.volume = 0.4;
            bgMusic.play().catch(e => console.log("Áudio aguardando interação"));
        }

        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            playMusic();
        }

        document.body.addEventListener('click', () => {
            if (bgMusic.paused) {
                playMusic();
            }
        }, { once: true });

        async function loadUserData() {
            try {
                const docRef = db.collection("players").doc(userId);
                const doc = await docRef.get();
                if (doc.exists) {
                    const data = doc.data();
                    score = data.score || 0;
                    energy = data.energy || 100;
                    maxEnergy = data.maxEnergy || 100;
                    maxEnergyCost = data.maxEnergyCost || 100;
                    autoClickerCost = data.autoClickerCost || 150;
                    autoClickerLevel = data.autoClickerLevel || 0;
                    lastDailyClaim = data.lastDailyClaim || "";
                    updateUI();
                } else {
                    saveUserData();
                }
            } catch (e) {
                console.error("Erro ao carregar dados:", e);
            }
        }

        async function saveUserData() {
            try {
                await db.collection("players").doc(userId).set({
                    name: userName,
                    score: score,
                    energy: energy,
                    maxEnergy: maxEnergy,
                    maxEnergyCost: maxEnergyCost,
                    autoClickerCost: autoClickerCost,
                    autoClickerLevel: autoClickerLevel,
                    lastDailyClaim: lastDailyClaim,
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
            } catch (e) {
                console.error("Erro ao guardar dados:", e);
            }
        }

        loadUserData();

        function switchTab(tabName, element) {
            document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));

            document.getElementById(`tab-${tabName}`).classList.add('active');
            element.classList.add('active');

            if (tabName === 'ranking') {
                loadRankingData();
            }
        }

        function handleClick(event) {
            if (energy > 0) {
                score += 1;
                energy -= 1;
                updateUI();
                saveUserData();
                
                const clickSound = document.getElementById("click-sound");
                clickSound.currentTime = 0;
                clickSound.play().catch(e => {});

                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                createFloatingText(event);

                const avatar = document.getElementById("waifu-avatar");
                avatar.style.transform = "scale(1.06)";
                setTimeout(() => {
                    avatar.style.transform = "scale(1)";
                }, 80);
            }
        }

        function createFloatingText(event) {
            const container = document.getElementById("container");
            const el = document.createElement("div");
            el.className = "floating-text";
            el.innerText = "+1 💖";
            
            const rect = container.getBoundingClientRect();
            let x = event.clientX ? event.clientX - rect.left : rect.width / 2;
            let y = event.clientY ? event.clientY - rect.top : rect.height / 2;
            
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            
            container.appendChild(el);
            setTimeout(() => el.remove(), 700);
        }

        function updateUI() {
            document.getElementById("score").innerText = score.toLocaleString();
            document.getElementById("energy-fill").style.width = (energy / maxEnergy) * 100 + "%";
            document.getElementById("energy-text").innerText = `${energy} / ${maxEnergy}`;
            document.getElementById("cost-energy").innerText = maxEnergyCost;
            document.getElementById("cost-auto").innerText = autoClickerCost;
        }

        async function loadRankingData() {
            const listEl = document.getElementById("ranking-list");
            listEl.innerHTML = "<li>A carregar ranking...</li>";
            try {
                const snapshot = await db.collection("players").orderBy("score", "desc").limit(10).get();
                listEl.innerHTML = "";
                let rank = 1;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    listEl.innerHTML += `<li><span>#${rank} ${data.name || 'CryptoUser'}</span> <strong>${(data.score || 0).toLocaleString()} pts</strong></li>`;
                    rank++;
                });
                if (snapshot.empty) {
                    listEl.innerHTML = "<li>Ainda sem jogadores.</li>";
                }
            } catch (e) {
                listEl.innerHTML = "<li>Erro ao carregar o ranking.</li>";
            }
        }

        function claimDailyBonus() {
            const today = new Date().toDateString();
            if (lastDailyClaim === today) {
                alert("Já reclamaste o teu bónus diário hoje!");
                return;
            }
            score += 200;
            lastDailyClaim = today;
            updateUI();
            saveUserData();
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            alert("🎁 +200 pontos adicionados ao teu saldo!");
        }

        function watchAdForEnergy() {
            if (adController) {
                adController.show().then((result) => {
                    energy = maxEnergy;
                    updateUI();
                    saveUserData();
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    alert("⚡ Energia recarregada com sucesso!");
                }).catch((err) => {
                    energy = maxEnergy;
                    updateUI();
                    saveUserData();
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    alert("⚡ Energia recarregada com sucesso!");
                });
            } else {
                energy = maxEnergy;
                updateUI();
                saveUserData();
                alert("⚡ Energia recarregada com sucesso!");
            }
        }

        function buyMaxEnergyUpgrade() {
            if (score >= maxEnergyCost) {
                score -= maxEnergyCost;
                maxEnergy += 50;
                energy = maxEnergy;
                maxEnergyCost = Math.floor(maxEnergyCost * 1.5);
                updateUI();
                saveUserData();
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                alert("Pontos insuficientes!");
            }
        }

        function buyAutoClicker() {
            if (score >= autoClickerCost) {
                score -= autoClickerCost;
                autoClickerLevel += 1;
                autoClickerCost = Math.floor(autoClickerCost * 1.8);
                updateUI();
                saveUserData();
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                alert("Pontos insuficientes!");
            }
        }

        function inviteFriend() {
            let botUsername = "MeuJogoCrypto2026"; 
            score += 50;
            updateUI();
            saveUserData();

            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            alert("Parabéns! Ganhaste +50 pontos por convidar um amigo!");

            let inviteLink = `https://t.me/share/url?url=https://t.me/${botUsername}&text=Vem%20jogar%20CryptoTap%20comigo%20e%20ganha%20pontos!%20🚀`;
            tg.openTelegramLink(inviteLink);
        }

        setInterval(() => {
            let changed = false;
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 2);
                changed = true;
            }
            if (autoClickerLevel > 0) {
                score += autoClickerLevel;
                changed = true;
            }
            if (changed) {
                updateUI();
                saveUserData();
            }
        }, 1000);
    </script>
</body>
</html>
