<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto Tap Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #120f29;
            --card-bg: rgba(255, 255, 255, 0.04);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .header {
            margin: 6px 12px 0 12px;
            background: var(--card-bg);
            padding: 8px 12px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .user-greeting {
            font-size: 11px;
            color: #d8b4fe;
            font-weight: 500;
        }

        .score-box {
            font-size: 34px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.1;
            margin: 2px 0;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }

        .score-label {
            font-size: 9px;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .dialogue-box {
            background: rgba(147, 51, 234, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 12px;
            color: #f3e8ff;
            margin: 4px auto 0 auto;
            display: inline-block;
            max-width: 95%;
        }

        .music-player {
            width: calc(100% - 24px);
            margin: 4px 12px 0 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 6px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .music-info {
            font-size: 11px;
            color: #c084fc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-btn {
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: white;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
        }

        .waifu-container {
            position: relative;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            width: 100%;
            padding: 5px 0;
        }

        .waifu-container img {
            max-height: 38vh;
            width: auto;
            max-width: 85vw;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(168, 85, 247, 0.2);
            border: 1px solid var(--border-color);
            transition: transform 0.08s ease;
            object-fit: contain;
        }

        .waifu-container img:active {
            transform: scale(0.95);
        }

        .heart {
            position: absolute;
            color: var(--accent-pink);
            font-size: 24px;
            font-weight: bold;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 20;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            100% { transform: translateY(-80px) scale(1.3); opacity: 0; }
        }

        .footer-section {
            width: calc(100% - 24px);
            margin: 0 12px 6px 12px;
            background: var(--card-bg);
            padding: 8px 12px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        .energy-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 4px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .energy-bar-container {
            background: rgba(255, 255, 255, 0.08);
            height: 5px;
            border-radius: 3px;
            overflow: hidden;
        }

        .energy-bar-fill {
            background: linear-gradient(90deg, #10b981, #34d399);
            width: 100%;
            height: 100%;
            border-radius: 3px;
            transition: width 0.15s linear;
        }

        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: #0d0a1f;
            width: 100%;
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px)) 0;
            border-top: 1px solid var(--border-color);
        }

        .nav-item {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            cursor: pointer;
            flex: 1;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--accent-pink);
        }

        .nav-icon {
            font-size: 15px;
            margin-bottom: 1px;
            display: block;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            backdrop-filter: blur(5px);
        }

        .modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #1a153b;
            border: 1px solid rgba(168, 85, 247, 0.4);
            width: 85%;
            max-width: 320px;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .modal-close {
            margin-top: 15px;
            background: var(--accent-purple);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Elemento de Áudio Real -->
    <audio id="bg-music" src="musica.mp3" loop></audio>

    <div class="header">
        <div id="user-info" class="user-greeting">A carregar...</div>
        <div class="score-box" id="score">0</div>
        <div class="score-label">Waifu Points</div>
        <div class="dialogue-box" id="dialogue">"Olá! Toca em mim para começarmos!"</div>
    </div>

    <div class="music-player">
        <div class="music-info" id="music-title">🎵 Piseiro Cyber Viciante (OST)</div>
        <button class="music-btn" id="next-music-btn">🎶 Tocar</button>
    </div>

    <div class="waifu-container" id="tap-area">
        <img src="waifu.png" alt="Waifu">
    </div>

    <div class="footer-section">
        <div class="energy-info">
            <span>⚡ Energia</span>
            <span id="energy-text">100 / 100</span>
        </div>
        <div class="energy-bar-container">
            <div id="energy-bar" class="energy-bar-fill"></div>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" id="nav-waifu" onclick="switchTab('waifu')">
            <span class="nav-icon">❤️</span>Waifu
        </div>
        <div class="nav-item" id="nav-loja" onclick="switchTab('loja')">
            <span class="nav-icon">⚡</span>Loja
        </div>
        <div class="nav-item" id="nav-ranking" onclick="switchTab('ranking')">
            <span class="nav-icon">🏆</span>Ranking
        </div>
        <div class="nav-item" id="nav-amigos" onclick="switchTab('amigos')">
            <span class="nav-icon">👥</span>Amigos
        </div>
    </div>

    <div class="modal" id="game-modal">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-top: 0; color: #d8b4fe;">Título</h3>
            <p id="modal-text" style="font-size: 13px; color: #cbd5e1; line-height: 1.4;">Mensagem</p>
            <button class="modal-close" onclick="closeModal()">Fechar</button>
        </div>
    </div>

    <script>
        let points = 0;
        let energy = 100;
        let userLevel = 1;
        let userName = "Miguel";

        const tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) {
            userName = tg.initDataUnsafe.user.first_name;
        }

        function updateUserInfo() {
            let titleName = "Iniciada";
            if (userLevel >= 2) titleName = "Conhecida";
            if (userLevel >= 3) titleName = "Amiga";
            if (userLevel >= 5) titleName = "Waifu Master";
            
            document.getElementById('user-info').innerText = `${userName} • Nível ${userLevel} • ${titleName}`;
        }
        updateUserInfo();

        // Controlo do Áudio Real
        const bgMusic = document.getElementById('bg-music');
        const musicTitleElem = document.getElementById('music-title');
        const musicBtn = document.getElementById('next-music-btn');

        musicBtn.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play().then(() => {
                    musicTitleElem.innerText = "🎵 A tocar: Piseiro Cyber (Loop)";
                    musicBtn.innerText = "⏸ Pausar";
                }).catch(e => {
                    console.log("Erro ao reproduzir áudio:", e);
                });
            } else {
                bgMusic.pause();
                musicTitleElem.innerText = "🎵 Piseiro Cyber Viciante (OST)";
                musicBtn.innerText = "🎶 Tocar";
            }
        });

        const welcomePhrases = [
            `Que bom ver-te por aqui, ${userName}!`,
            `Estava com saudades, ${userName}! Vamos farmar?`,
            `Força com isso, ${userName}! O topo é nosso!`,
            `Tens mãos rápidas hoje, ${userName}?`,
            `Pronta para te dar sorte hoje, ${userName}!`
        ];

        const clickPhrases = [
            "Isso mesmo, continua a focar!",
            "Adoro quando me dás atenção!",
            "Mais um ponto para a nossa conta!",
            "Estás a ir com excelente ritmo!",
            "Não pares agora, estamos quase no topo!"
        ];

        const dialogueElem = document.getElementById('dialogue');
        dialogueElem.innerText = `"${welcomePhrases[Math.floor(Math.random() * welcomePhrases.length)]}"`;

        const tapArea = document.getElementById('tap-area');
        const scoreDisplay = document.getElementById('score');
        const energyBar = document.getElementById('energy-bar');
        const energyText = document.getElementById('energy-text');

        tapArea.addEventListener('pointerdown', (e) => {
            if (energy > 0) {
                points += 1;
                energy -= 1;
                scoreDisplay.innerText = points;
                
                energyBar.style.width = energy + '%';
                energyText.innerText = energy + ' / 100';

                let newLevel = Math.floor(points / 50) + 1;
                if (newLevel > userLevel) {
                    userLevel = newLevel;
                    dialogueElem.innerText = `🎉 "Subimos para o Nível ${userLevel}! És incrível, ${userName}!"`;
                } else if (points % 5 === 0) {
                    const randomClickPhrase = clickPhrases[Math.floor(Math.random() * clickPhrases.length)];
                    dialogueElem.innerText = `"${randomClickPhrase}"`;
                }

                updateUserInfo();
                createHeart(e);
            }
        });

        setInterval(() => {
            if (energy < 100) {
                energy = Math.min(100, energy + 2);
                energyBar.style.width = energy + '%';
                energyText.innerText = energy + ' / 100';
            }
        }, 1000);

        function createHeart(event) {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            
            const rect = tapArea.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            
            heart.style.left = (x - 12) + 'px';
            heart.style.top = (y - 12) + 'px';
            
            tapArea.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 800);
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));

            const modal = document.getElementById('game-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalText = document.getElementById('modal-text');

            if (tab === 'waifu') {
                document.getElementById('nav-waifu').classList.add('active');
                modal.classList.remove('open');
            } 
            else if (tab === 'loja') {
                document.getElementById('nav-loja').classList.add('active');
                modalTitle.innerText = "⚡ Loja de Bónus";
                modalText.innerText = "Em breve poderás gastar os teus Waifu Points em melhorias de energia e novas roupas!";
                modal.classList.add('open');
            } 
            else if (tab === 'ranking') {
                document.getElementById('nav-ranking').classList.add('active');
                modalTitle.innerText = "🏆 Ranking Global";
                modalText.innerText = `Estás atualmente em 1º lugar na tabela com ${points} pontos e no Nível ${userLevel}. Força, ${userName}!`;
                modal.classList.add('open');
            } 
            else if (tab === 'amigos') {
                document.getElementById('nav-amigos').classList.add('active');
                const botUrl = "https://t.me/MeuJogoCrypto2026_bot";
                const shareText = encodeURIComponent(`Junta-te a mim no Crypto Tap Game e ajuda-nos a subir no ranking! 🚀`);
                
                if (tg && tg.openTelegramLink) {
                    tg.openTelegramLink(`https://t.me/share/url?url=${botUrl}&text=${shareText}`);
                } else {
                    window.open(`https://t.me/share/url?url=${botUrl}&text=${shareText}`, '_blank');
                }
            }
        }

        function closeModal() {
            document.getElementById('game-modal').classList.remove('open');
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.getElementById('nav-waifu').classList.add('active');
        }
    </script>
</body>
</html>
