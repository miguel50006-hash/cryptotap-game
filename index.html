<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto Tap Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase JS Client para gercar a nuvem e o ranking -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #120f29;
            --card-bg: rgba(255, 255, 255, 0.04);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --accent-gold: #fbbf24;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .header {
            margin: 6px 12px 0 12px;
            background: var(--card-bg);
            padding: 8px 12px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .user-greeting {
            font-size: 11px;
            color: #d8b4fe;
            font-weight: 500;
        }

        .score-box {
            font-size: 34px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.1;
            margin: 2px 0;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
            transition: transform 0.1s ease;
        }

        .score-box.crit-pop {
            transform: scale(1.15);
            color: var(--accent-gold);
        }

        .score-label {
            font-size: 9px;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .dialogue-box {
            background: rgba(147, 51, 234, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 12px;
            color: #f3e8ff;
            margin: 4px auto 0 auto;
            display: inline-block;
            max-width: 95%;
            transition: all 0.2s ease;
        }

        .waifu-container {
            position: relative;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            width: 100%;
            padding: 5px 0;
        }

        .waifu-container img {
            max-height: 38vh;
            width: auto;
            max-width: 85vw;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(168, 85, 247, 0.2);
            border: 1px solid var(--border-color);
            transition: transform 0.08s ease;
            object-fit: contain;
        }

        .waifu-container img:active {
            transform: scale(0.95);
        }

        .floating-text {
            position: absolute;
            font-weight: 900;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 20;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }

        .heart {
            color: var(--accent-pink);
            font-size: 24px;
        }

        .crit-text {
            color: var(--accent-gold);
            font-size: 28px;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            100% { transform: translateY(-85px) scale(1.4); opacity: 0; }
        }

        .footer-section {
            width: calc(100% - 24px);
            margin: 0 12px 6px 12px;
            background: var(--card-bg);
            padding: 8px 12px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        .energy-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 4px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .energy-bar-container {
            background: rgba(255, 255, 255, 0.08);
            height: 5px;
            border-radius: 3px;
            overflow: hidden;
        }

        .energy-bar-fill {
            background: linear-gradient(90deg, #10b981, #34d399);
            width: 100%;
            height: 100%;
            border-radius: 3px;
            transition: width 0.15s linear;
        }

        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: #0d0a1f;
            width: 100%;
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px)) 0;
            border-top: 1px solid var(--border-color);
        }

        .nav-item {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            cursor: pointer;
            flex: 1;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--accent-pink);
        }

        .nav-icon {
            font-size: 15px;
            margin-bottom: 1px;
            display: block;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            backdrop-filter: blur(5px);
        }

        .modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #1a153b;
            border: 1px solid rgba(168, 85, 247, 0.4);
            width: 88%;
            max-width: 330px;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            max-height: 85vh;
            overflow-y: auto;
        }

        .shop-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .shop-btn {
            background: var(--accent-purple);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .ranking-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 12px;
            border-radius: 6px;
            margin-bottom: 4px;
        }

        .modal-close {
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="header">
        <div id="user-info" class="user-greeting">A carregar nuvem...</div>
        <div class="score-box" id="score">0</div>
        <div class="score-label">Waifu Points (Cloud Sync)</div>
        <div class="dialogue-box" id="dialogue">"A sincronizar com os servidores..."</div>
    </div>

    <div class="waifu-container" id="tap-area">
        <img src="waifu.png" alt="Waifu">
    </div>

    <div class="footer-section">
        <div class="energy-info">
            <span>⚡ Energia</span>
            <span id="energy-text">100 / 100</span>
        </div>
        <div class="energy-bar-container">
            <div id="energy-bar" class="energy-bar-fill"></div>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" id="nav-waifu" onclick="switchTab('waifu')">
            <span class="nav-icon">❤️</span>Waifu
        </div>
        <div class="nav-item" id="nav-loja" onclick="switchTab('loja')">
            <span class="nav-icon">⚡</span>Loja
        </div>
        <div class="nav-item" id="nav-ranking" onclick="switchTab('ranking')">
            <span class="nav-icon">🏆</span>Ranking
        </div>
        <div class="nav-item" id="nav-amigos" onclick="switchTab('amigos')">
            <span class="nav-icon">👥</span>Amigos
        </div>
    </div>

    <div class="modal" id="game-modal">
        <div class="modal-content" id="modal-body-content"></div>
    </div>

    <script>
        // --- CONFIGURAÇÃO DA NUVEM (SUPABASE) ---
        // Credenciais ligadas ao teu projeto Supabase estbfgbquhtnxiizmwqzp
        const SUPABASE_URL = 'https://stbfgbquhtnxiizmwqzp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_LRJvCKIncO1YpBfi-bI_Pw_D_9WmU74';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let points = 0;
        let energy = 100;
        let maxEnergy = 100;
        let userLevel = 1;
        let userId = "user_" + Math.floor(Math.random() * 100000); // ID temporário caso abra fora do Telegram
        let userName = "Miguel";
        let tapPower = 1;
        let energyRegenRate = 2;

        const tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            if (tg.initDataUnsafe.user.id) userId = String(tg.initDataUnsafe.user.id);
            if (tg.initDataUnsafe.user.first_name) userName = tg.initDataUnsafe.user.first_name;
        }

        // Carregar dados iniciais do jogador a partir da Nuvem
        async function loadPlayerData() {
            const { data, error } = await supabaseClient
                .from('players')
                .select('*')
                .eq('telegram_id', userId)
                .single();

            if (data) {
                points = data.score || 0;
                userLevel = Math.floor(points / 100) + 1;
                document.getElementById('score').innerText = points;
            } else {
                // Se o jogador não existir na base de dados, cria o registo inicial
                await supabaseClient.from('players').insert([
                    { telegram_id: userId, username: userName, score: 0 }
                ]);
            }
            updateUserInfo();
            dialogueElem.innerText = `"Olá de novo, ${userName}! Vamos ao topo!"`;
        }
        loadPlayerData();

        // Sincronizar pontos na nuvem (com salvamento otimizado)
        let saveTimeout = null;
        function syncScoreToCloud() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                await supabaseClient
                    .from('players')
                    .update({ score: points, username: userName })
                    .eq('telegram_id', userId);
            }, 1000); // Guarda na nuvem 1 segundo após o último clique para poupar largura de banda
        }

        function updateUserInfo() {
            let titleName = "Iniciada";
            if (userLevel >= 2) titleName = "Conhecida";
            if (userLevel >= 3) titleName = "Amiga";
            if (userLevel >= 5) titleName = "Waifu Master";
            
            document.getElementById('user-info').innerText = `${userName} • Nível ${userLevel} • ${titleName}`;
        }

        const dialogueElem = document.getElementById('dialogue');
        const clickPhrases = [
            "Isso mesmo, continua a focar!",
            "Adoro quando me dás atenção!",
            "Mais pontos para a nossa conta!",
            "Estás a ir com excelente ritmo!",
            "Uau, que velocidade incrível!"
        ];

        const tapArea = document.getElementById('tap-area');
        const scoreDisplay = document.getElementById('score');
        const energyBar = document.getElementById('energy-bar');
        const energyText = document.getElementById('energy-text');

        tapArea.addEventListener('pointerdown', (e) => {
            if (energy > 0) {
                let earned = tapPower;
                let isCrit = Math.random() < 0.15;

                if (isCrit) {
                    earned *= 3;
                    scoreDisplay.classList.add('crit-pop');
                    setTimeout(() => scoreDisplay.classList.remove('crit-pop'), 150);
                    dialogueElem.innerText = `🔥 "CRÍTICO NA NUVEM! Força, ${userName}!"`;
                }

                points += earned;
                energy = Math.max(0, energy - 1);
                scoreDisplay.innerText = points;
                
                energyBar.style.width = (energy / maxEnergy) * 100 + '%';
                energyText.innerText = `${energy} / ${maxEnergy}`;

                let newLevel = Math.floor(points / 100) + 1;
                if (newLevel > userLevel) {
                    userLevel = newLevel;
                    dialogueElem.innerText = `🎉 "Nível ${userLevel} atingido na nuvem!"`;
                } else if (!isCrit && points % 6 === 0) {
                    dialogueElem.innerText = `"${clickPhrases[Math.floor(Math.random() * clickPhrases.length)]}"`;
                }

                updateUserInfo();
                syncScoreToCloud();
                createFloatingEffect(e, isCrit ? `+${earned} CRIT!` : '❤️', isCrit);
            } else {
                dialogueElem.innerText = `💤 "A energia esgotou-se... Calma!"`;
            }
        });

        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + energyRegenRate);
                energyBar.style.width = (energy / maxEnergy) * 100 + '%';
                energyText.innerText = `${energy} / ${maxEnergy}`;
            }
        }, 1000);

        function createFloatingEffect(event, text, isCrit) {
            const el = document.createElement('div');
            el.classList.add('floating-text');
            el.classList.add(isCrit ? 'crit-text' : 'heart');
            el.innerHTML = text;
            
            const rect = tapArea.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            
            el.style.left = (x - 15) + 'px';
            el.style.top = (y - 15) + 'px';
            
            tapArea.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));

            const modal = document.getElementById('game-modal');
            const modalBody = document.getElementById('modal-body-content');

            if (tab === 'waifu') {
                document.getElementById('nav-waifu').classList.add('active');
                modal.classList.remove('open');
            } 
            else if (tab === 'loja') {
                document.getElementById('nav-loja').classList.add('active');
                renderShopModal(modalBody);
                modal.classList.add('open');
            } 
            else if (tab === 'ranking') {
                document.getElementById('nav-ranking').classList.add('active');
                renderRankingModal(modalBody);
                modal.classList.add('open');
            } 
            else if (tab === 'amigos') {
                document.getElementById('nav-amigos').classList.add('active');
                const botUrl = "https://t.me/MeuJogoCrypto2026_bot";
                const shareText = encodeURIComponent(`Junta-te a mim no Crypto Tap Game e luta pelo Top 10 diário! 🚀`);
                
                if (tg && tg.openTelegramLink) {
                    tg.openTelegramLink(`https://t.me/share/url?url=${botUrl}&text=${shareText}`);
                } else {
                    window.open(`https://t.me/share/url?url=${botUrl}&text=${shareText}`, '_blank');
                }
            }
        }

        function renderShopModal(container) {
            let multitapCost = 50 * tapPower;
            let energyCost = 80;

            container.innerHTML = `
                <h3 style="margin-top: 0; color: #d8b4fe;">⚡ Loja Global</h3>
                <p style="font-size: 12px; color: #cbd5e1; margin-bottom: 15px;">Os upgrades ficam guardados na nuvem!</p>
                
                <div class="shop-item">
                    <div style="text-align: left; font-size: 12px;">
                        <strong>Multitap (+1)</strong><br><span style="color: #a78bfa;">Nível ${tapPower}</span>
                    </div>
                    <button class="shop-btn" onclick="buyUpgrade('multitap', ${multitapCost})">${multitapCost} WP</button>
                </div>

                <div class="shop-item">
                    <div style="text-align: left; font-size: 12px;">
                        <strong>Max Energia (+50)</strong><br><span style="color: #a78bfa;">Atual: ${maxEnergy}</span>
                    </div>
                    <button class="shop-btn" onclick="buyUpgrade('energy', ${energyCost})">${energyCost} WP</button>
                </div>

                <button class="modal-close" onclick="closeModal()">Fechar</button>
            `;
        }

        function buyUpgrade(type, cost) {
            if (points >= cost) {
                points -= cost;
                scoreDisplay.innerText = points;
                if (type === 'multitap') tapPower += 1;
                else if (type === 'energy') {
                    maxEnergy += 50;
                    energy = maxEnergy;
                    energyBar.style.width = '100%';
                    energyText.innerText = `${energy} / ${maxEnergy}`;
                }
                syncScoreToCloud();
                renderShopModal(document.getElementById('modal-body-content'));
            } else {
                alert("Pontos insuficientes!");
            }
        }

        // Puxar o Top 10 real direto da Nuvem
        async function renderRankingModal(container) {
            container.innerHTML = `<h3 style="color: #d8b4fe;">🏆 Top 10 Global</h3><p style="font-size:12px; color:#9ca3af;">A carregar melhores jogadores...</p>`;
            
            const { data: topPlayers, error } = await supabaseClient
                .from('players')
                .select('username, score')
                .order('score', { ascending: false })
                .limit(10);

            let html = `<h3 style="margin-top: 0; color: #d8b4fe;">🏆 Top 10 Global</h3><p style="font-size: 11px; color: #cbd5e1; margin-bottom: 12px;">Os prémios diários saem daqui!</p>`;
            
            if (topPlayers && topPlayers.length > 0) {
                topPlayers.forEach((player, index) => {
                    let medal = index === 0 ? '🥇' : (index === 1 ? '🥈' : (index === 2 ? '🥉' : `#${index+1}`));
                    html += `
                        <div class="ranking-row">
                            <span>${medal} <strong>${player.username || 'Anónimo'}</strong></span>
                            <span style="color: #a78bfa; font-weight: bold;">${player.score} WP</span>
                        </div>
                    `;
                });
            } else {
                html += `<p style="font-size: 12px;">Ainda sem registos na nuvem.</p>`;
            }

            html += `<button class="modal-close" onclick="closeModal()">Fechar</button>`;
            container.innerHTML = html;
        }

        function closeModal() {
            document.getElementById('game-modal').classList.remove('open');
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.getElementById('nav-waifu').classList.add('active');
        }
    </script>
</body>
</html>
