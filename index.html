<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waifu Tap Game</title>
    <!-- Supabase Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0b0614;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
            overflow: hidden;
            user-select: none;
        }
        /* Top bar */
        .top-bar {
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .user-info { font-size: 13px; color: #d8b4fe; margin-bottom: 4px; }
        .score-title { font-size: 11px; letter-spacing: 1px; color: #94a3b8; text-transform: uppercase; }
        .score-num { font-size: 32px; font-weight: bold; color: #ffffff; }
        .dialogue {
            background: rgba(147, 51, 234, 0.15);
            border: 1px solid rgba(147, 51, 234, 0.3);
            border-radius: 20px;
            padding: 6px 15px;
            font-size: 13px;
            color: #e9d5ff;
            margin-top: 5px;
        }
        
        /* Main character area */
        .game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            cursor: pointer;
        }
        .character-card {
            width: 240px;
            height: 380px;
            background: #1e1b4b;
            border-radius: 20px;
            border: 2px solid rgba(168, 85, 247, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.05s ease;
        }
        .character-card:active { transform: scale(0.97); }
        .character-card img { width: 100%; height: 100%; object-fit: cover; }

        /* Bottom section */
        .bottom-panel {
            padding: 15px;
            background: #0b0614;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .energy-container {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .energy-bar-bg {
            background: #1e1b4b;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .energy-bar-fill {
            background: linear-gradient(90deg, #10b981, #34d399);
            height: 100%;
            width: 100%;
            transition: width 0.3s;
        }

        /* Navigation bar */
        .nav-bar {
            display: flex;
            justify-content: space-around;
            padding-top: 5px;
        }
        .nav-item {
            background: none;
            border: none;
            color: #64748b;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            gap: 3px;
        }
        .nav-item.active { color: #f43f5e; }
        .nav-item span.icon { font-size: 18px; }

        /* Leaderboard Modal Overlay */
        #leaderboard-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 6, 20, 0.9);
            z-index: 100;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        .lb-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .lb-list { overflow-y: auto; flex-grow: 1; }
        .lb-row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 14px; }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="user-info" id="user-info-text">Miguel • Nível 1 • Iniciada</div>
        <div class="score-title">Waifu Points</div>
        <div class="score-num" id="score">17</div>
        <div class="dialogue" id="dialogue-text">"Isso mesmo, continua a focar!"</div>
    </div>

    <!-- Main Tap Character -->
    <div class="game-container" onclick="tapCharacter()">
        <div class="character-card">
            <!-- Podes colocar aqui o link da imagem da tua waifu -->
            <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=400" alt="Waifu">
        </div>
    </div>

    <!-- Bottom Panel -->
    <div class="bottom-panel">
        <div class="energy-container">
            <span>⚡ Energia</span>
            <span id="energy-text">100 / 100</span>
        </div>
        <div class="energy-bar-bg">
            <div class="energy-bar-fill" id="energy-fill"></div>
        </div>

        <!-- Navigation Menu -->
        <div class="nav-bar">
            <button class="nav-item active">
                <span class="icon">❤️</span>
                Waifu
            </button>
            <button class="nav-item" onclick="alert('Loja em breve!')">
                <span class="icon">⚡</span>
                Loja
            </button>
            <button class="nav-item" onclick="openLeaderboard()">
                <span class="icon">🏆</span>
                Ranking
            </button>
            <button class="nav-item" onclick="alert('Secção de amigos!')">
                <span class="icon">👥</span>
                Amigos
            </button>
        </div>
    </div>

    <!-- Ranking Modal -->
    <div id="leaderboard-modal">
        <div class="lb-header">
            <h3>🏆 Ranking Global</h3>
            <button onclick="closeLeaderboard()" style="background:none; border:none; color:white; font-size:18px; cursor:pointer;">✕</button>
        </div>
        <div class="lb-list" id="lb-content">A carregar ranking...</div>
    </div>

    <script>
        // Configuração do Supabase ligada à tua base de dados
        const SUPABASE_URL = 'https://stbfgbquhtnxiizmwqzp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_LRJvCKIncO1YpBfi-bI_Pw_D_9WmU74';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Identificação simulada do jogador atual (pode ser ligada ao Telegram WebApp depois)
        const player = {
            telegram_id: 'miguel_50006',
            username: 'Miguel'
        };

        let score = 17;
        let energy = 100;

        async function tapCharacter() {
            if (energy <= 0) return; // Se não houver energia, não deixa clicar

            score += 1;
            energy -= 1;

            document.getElementById('score').innerText = score;
            document.getElementById('energy-text').innerText = energy + ' / 100';
            document.getElementById('energy-fill').style.width = energy + '%';

            // Guarda os pontos diretamente na tabela 'players' na nuvem do Supabase
            const { error } = await supabaseClient
                .from('players')
                .upsert({ 
                    telegram_id: player.telegram_id, 
                    username: player.username, 
                    score: score 
                }, { onConflict: 'telegram_id' });

            if (error) {
                console.error('Erro ao sincronizar com o Supabase:', error.message);
            }
        }

        // Recuperar e regenerar energia aos poucos
        setInterval(() => {
            if (energy < 100) {
                energy += 1;
                document.getElementById('energy-text').innerText = energy + ' / 100';
                document.getElementById('energy-fill').style.width = energy + '%';
            }
        }, 1000);

        async function openLeaderboard() {
            document.getElementById('leaderboard-modal').style.display = 'flex';
            const lbContent = document.getElementById('lb-content');
            lbContent.innerHTML = 'A carregar...';

            const { data, error } = await supabaseClient
                .from('players')
                .select('username, score')
                .order('score', { ascending: false })
                .limit(10);

            if (error) {
                lbContent.innerHTML = 'Erro ao carregar o ranking da nuvem.';
                return;
            }

            if (!data || data.length === 0) {
                lbContent.innerHTML = '<div style="text-align:center; margin-top:20px; color:#94a3b8;">Ainda sem jogadores no ranking. Dá o primeiro clique!</div>';
                return;
            }

            lbContent.innerHTML = data.map((p, index) => `
                <div class="lb-row">
                    <span><strong>#${index + 1}</strong> ${p.username}</span>
                    <span style="color:#facc15;">${p.score} pts</span>
                </div>
            `).join('');
        }

        function closeLeaderboard() {
            document.getElementById('leaderboard-modal').style.display = 'none';
        }
    </script>
</body>
</html>
