<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto Tap Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #0b0614;
            --card-bg: rgba(255, 255, 255, 0.04);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --accent-gold: #fbbf24;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            padding-top: 52px;
            padding-bottom: env(safe-area-inset-bottom, 8px);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .header {
            margin: 0 12px 0 12px;
            background: var(--card-bg);
            padding: 6px 10px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            position: relative;
        }

        .ad-bonus-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(135deg, #fbbf24, #d97706);
            border: none;
            border-radius: 10px;
            color: #120f29;
            font-weight: 800;
            font-size: 10px;
            padding: 5px 8px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
            display: flex;
            align-items: center;
            gap: 3px;
            transition: transform 0.1s ease;
        }
        .ad-bonus-btn:active { transform: translateY(-50%) scale(0.95); }

        .user-greeting {
            font-size: 10px;
            color: #d8b4fe;
            font-weight: 500;
        }

        .score-box {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.1;
            margin: 2px 0;
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            transition: transform 0.1s ease;
        }

        .score-box.crit-pop {
            transform: scale(1.15);
            color: var(--accent-gold);
        }

        .score-label {
            font-size: 8px;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .dialogue-box {
            background: rgba(147, 51, 234, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 3px 10px;
            border-radius: 14px;
            font-size: 11px;
            color: #f3e8ff;
            margin: 2px auto 0 auto;
            display: inline-block;
            max-width: 85%;
        }

        .waifu-container {
            position: relative;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            width: 100%;
            padding: 2px 0;
        }

        .waifu-container img {
            max-height: 34vh;
            width: auto;
            max-width: 80vw;
            border-radius: 12px;
            filter: drop-shadow(0 0 18px rgba(168, 85, 247, 0.75)) drop-shadow(0 0 35px rgba(236, 72, 153, 0.4));
            transition: transform 0.08s ease, filter 0.1s ease;
            object-fit: contain;
        }

        .waifu-container img:active {
            transform: scale(0.96);
            filter: drop-shadow(0 0 22px rgba(251, 191, 36, 0.9));
        }

        .floating-star {
            position: absolute;
            font-size: 22px;
            font-weight: bold;
            animation: starFloat 0.9s ease-out forwards;
            pointer-events: none;
            z-index: 30;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.8);
        }

        @keyframes starFloat {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 1; }
            50% { opacity: 1; }
            100% { transform: translateY(-90px) scale(1.3) rotate(360deg); opacity: 0; }
        }

        .footer-section {
            width: calc(100% - 20px);
            margin: 0 10px 4px 10px;
            background: var(--card-bg);
            padding: 6px 10px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .energy-info {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            margin-bottom: 3px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .energy-bar-container {
            background: rgba(255, 255, 255, 0.08);
            height: 4px;
            border-radius: 3px;
            overflow: hidden;
        }

        .energy-bar-fill {
            background: linear-gradient(90deg, #10b981, #34d399);
            width: 100%;
            height: 100%;
            border-radius: 3px;
            transition: width 0.15s linear;
        }

        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: #0d0a1f;
            width: 100%;
            padding: 6px 0;
            border-top: 1px solid var(--border-color);
        }

        .nav-item {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            cursor: pointer;
            flex: 1;
            transition: color 0.2s;
            background: none;
            border: none;
            outline: none;
            font-family: inherit;
        }

        .nav-item.active {
            color: var(--accent-pink);
        }

        .nav-icon {
            font-size: 15px;
            margin-bottom: 1px;
            display: block;
        }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex; justify-content: center; align-items: center;
            z-index: 100; opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease; backdrop-filter: blur(5px);
        }

        .modal.open { opacity: 1; pointer-events: auto; }

        .modal-content {
            background: #1a153b;
            border: 1px solid rgba(168, 85, 247, 0.4);
            width: 88%; max-width: 330px; padding: 16px;
            border-radius: 18px; text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            max-height: 80vh; overflow-y: auto;
        }

        .shop-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px; border-radius: 10px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .shop-btn {
            background: var(--accent-purple); color: white; border: none;
            padding: 5px 10px; border-radius: 7px; font-size: 11px; font-weight: 600; cursor: pointer;
        }

        .ranking-row {
            display: flex; justify-content: space-between; padding: 7px 8px;
            background: rgba(255, 255, 255, 0.03); border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 11px; border-radius: 6px; margin-bottom: 3px;
        }

        .modal-close {
            margin-top: 12px; background: rgba(255, 255, 255, 0.1); color: white;
            border: none; padding: 7px 16px; border-radius: 9px; font-weight: 600; cursor: pointer; width: 100%;
        }
    </style>
</head>
<body>

    <div class="header">
        <div id="user-info" class="user-greeting">A carregar nuvem...</div>
        <div class="score-box" id="score">0</div>
        <div class="score-label">Waifu Points (Cloud Sync)</div>
        <div class="dialogue-box" id="dialogue">"A sincronizar com os servidores..."</div>
        <button class="ad-bonus-btn" onclick="watchAdReward()">🎁 Bónus</button>
    </div>

    <div class="waifu-container" id="tap-area">
        <img src="waifu.png" alt="Waifu">
    </div>

    <div class="footer-section">
        <div class="energy-info">
            <span>⚡ Energia</span>
            <span id="energy-text">100 / 100</span>
        </div>
        <div class="energy-bar-container">
            <div id="energy-bar" class="energy-bar-fill"></div>
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-item active" id="nav-waifu" onclick="switchTab('waifu')">
            <span class="nav-icon">❤️</span>Waifu
        </button>
        <button class="nav-item" id="nav-loja" onclick="switchTab('loja')">
            <span class="nav-icon">⚡</span>Loja
        </button>
        <button class="nav-item" id="nav-ranking" onclick="switchTab('ranking')">
            <span class="nav-icon">🏆</span>Ranking
        </button>
        <button class="nav-item" id="nav-amigos" onclick="switchTab('amigos')">
            <span class="nav-icon">👥</span>Amigos
        </button>
    </div>

    <div class="modal" id="game-modal">
        <div class="modal-content" id="modal-body-content"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://stbfgbquhtnxiizmwqzp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_LRJvCKIncO1YpBfi-bI_Pw_D_9WmU74';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let points = 0;
        let energy = 100;
        let maxEnergy = 100;
        let userLevel = 1;
        let userId = "user_" + Math.floor(Math.random() * 100000);
        let userName = "Miguel";
        let tapPower = 1;
        let energyRegenRate = 2;

        const tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            if (tg.initDataUnsafe.user.id) userId = String(tg.initDataUnsafe.user.id);
            if (tg.initDataUnsafe.user.first_name) userName = tg.initDataUnsafe.user.first_name;
        }

        async function loadPlayerData() {
            const { data } = await supabaseClient
                .from('players')
                .select('*')
                .eq('telegram_id', userId)
                .single();

            if (data) {
                points = data.score || 0;
                userLevel = Math.floor(points / 100) + 1;
                document.getElementById('score').innerText = points;
            } else {
                await supabaseClient.from('players').insert([
                    { telegram_id: userId, username: userName, score: 0 }
                ]);
            }
            updateUserInfo();
            dialogueElem.innerText = `"Olá de novo, ${userName}! Vamos ao topo!"`;
        }
        loadPlayerData();

        let saveTimeout = null;
        function syncScoreToCloud() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                await supabaseClient
                    .from('players')
                    .update({ score: points, username: userName })
                    .eq('telegram_id', userId);
            }, 1000);
        }

        function updateUserInfo() {
            let titleName = "Iniciada";
            if (userLevel >= 2) titleName = "Conhecida";
            if (userLevel >= 3) titleName = "Amiga";
            if (userLevel >= 5) titleName = "Waifu Master";
            document.getElementById('user-info').innerText = `${userName} • Nível ${userLevel} • ${titleName}`;
        }

        const dialogueElem = document.getElementById('dialogue');
        const clickPhrases = [
            "Isso mesmo, continua a focar!",
            "Adoro quando me dás atenção!",
            "Mais pontos para a nossa conta!",
            "Estás a ir com excelente ritmo!"
        ];

        const tapArea = document.getElementById('tap-area');
        const scoreDisplay = document.getElementById('score');
        const energyBar = document.getElementById('energy-bar');
        const energyText = document.getElementById('energy-text');

        tapArea.addEventListener('pointerdown', (e) => {
            if (energy > 0) {
                let earned = tapPower;
                let isCrit = Math.random() < 0.15;

                if (isCrit) {
                    earned *= 3;
                    scoreDisplay.classList.add('crit-pop');
                    setTimeout(() => scoreDisplay.classList.remove('crit-pop'), 150);
                    dialogueElem.innerText = `🔥 "CRÍTICO! Força, ${userName}!"`;
                }

                points += earned;
                energy = Math.max(0, energy - 1);
                scoreDisplay.innerText = points;
                
                energyBar.style.width = (energy / maxEnergy) * 100 + '%';
                energyText.innerText = `${energy} / ${maxEnergy}`;

                let newLevel = Math.floor(points / 100) + 1;
                if (newLevel > userLevel) {
                    userLevel = newLevel;
                    dialogueElem.innerText = `🎉 "Nível ${userLevel} alcançado!"`;
                } else if (!isCrit && points % 6 === 0) {
                    dialogueElem.innerText = `"${clickPhrases[Math.floor(Math.random() * clickPhrases.length)]}"`;
                }

                updateUserInfo();
                syncScoreToCloud();
                createStarEffect(e);
            } else {
                dialogueElem.innerText = `💤 "A energia esgotou-se... Calma!"`;
            }
        });

        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + energyRegenRate);
                energyBar.style.width = (energy / maxEnergy) * 100 + '%';
                energyText.innerText = `${energy} / ${maxEnergy}`;
            }
        }, 1000);

        function createStarEffect(event) {
            const rect = tapArea.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            for (let i = 0; i < 3; i++) {
                const star = document.createElement('div');
                star.classList.add('floating-star');
                star.innerHTML = i === 0 ? '⭐' : (i === 1 ? '✨' : '🌟');
                
                const offsetX = (Math.random() - 0.5) * 50;
                const offsetY = (Math.random() - 0.5) * 30;
                
                star.style.left = (x + offsetX) + 'px';
                star.style.top = (y + offsetY) + 'px';
                
                tapArea.appendChild(star);
                setTimeout(() => star.remove(), 900);
            }
        }

        // Sistema dinâmico e resiliente para disparar o anúncio da Adsgram
        function watchAdReward() {
            dialogueElem.innerText = `⏳ "A carregar anúncio..."`;

            if (typeof window.Adsgram !== 'undefined') {
                try {
                    const adController = window.Adsgram.init({ blockId: "int-47862" });
                    adController.show()
                        .then(() => {
                            grantAdReward();
                        })
                        .catch((err) => {
                            console.error("Adsgram show error:", err);
                            // Fallback automático para garantir que o jogador ganha pontos se o ad falhar
                            grantAdReward();
                        });
                    return;
                } catch (e) {
                    console.error("Adsgram init error:", e);
                }
            }

            // Injeção dinâmica do SDK caso não estivesse carregado
            const script = document.createElement('script');
            script.src = "https://sad.adsgram.ai/js/adsgram.min.js";
            script.onload = () => {
                try {
                    const adController = window.Adsgram.init({ blockId: "int-47862" });
                    adController.show()
                        .then(() => { grantAdReward(); })
                        .catch(() => { grantAdReward(); });
                } catch (ex) {
                    grantAdReward();
                }
            };
            script.onerror = () => {
                // Se a rede bloquear o script por completo, dá o bónus para não bloquear a experiência
                grantAdReward();
            };
            document.head.appendChild(script);
        }

        function grantAdReward() {
            points += 150;
            scoreDisplay.innerText = points;
            dialogueElem.innerText = `🎁 "Parabéns! +150 Waifu Points adicionados!"`;
            syncScoreToCloud();
            scoreDisplay.classList.add('crit-pop');
            setTimeout(() => scoreDisplay.classList.remove('crit-pop'), 300);
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            const modal = document.getElementById('game-modal');
            const modalBody = document.getElementById('modal-body-content');

            if (tab === 'waifu') {
                document.getElementById('nav-waifu').classList.add('active');
                modal.classList.remove('open');
            } else if (tab === 'loja') {
                document.getElementById('nav-loja').classList.add('active');
                renderShopModal(modalBody);
                modal.classList.add('open');
            } else if (tab === 'ranking') {
                document.getElementById('nav-ranking').classList.add('active');
                renderRankingModal(modalBody);
                modal.classList.add('open');
            } else if (tab === 'amigos') {
                document.getElementById('nav-amigos').classList.add('active');
                const botUrl = "https://t.me/MeuJogoCrypto2026_bot";
                const shareText = encodeURIComponent(`Junta-te a mim no Crypto Tap Game e luta pelo Top 10! 🚀`);
                if (tg && tg.openTelegramLink) {
                    tg.openTelegramLink(`https://t.me/share/url?url=${botUrl}&text=${shareText}`);
                } else {
                    window.open(`https://t.me/share/url?url=${botUrl}&text=${shareText}`, '_blank');
                }
            }
        }

        function renderShopModal(container) {
            let multitapCost = 50 * tapPower;
            let energyCost = 80;
            container.innerHTML = `
                <h3 style="margin-top: 0; color: #d8b4fe; font-size: 16px;">⚡ Loja Global</h3>
                <div class="shop-item">
                    <div style="text-align: left; font-size: 11px;"><strong>Multitap (+1)</strong><br><span style="color: #a78bfa;">Nível ${tapPower}</span></div>
                    <button class="shop-btn" onclick="buyUpgrade('multitap', ${multitapCost})">${multitapCost} WP</button>
                </div>
                <div class="shop-item">
                    <div style="text-align: left; font-size: 11px;"><strong>Max Energia (+50)</strong><br><span style="color: #a78bfa;">Atual: ${maxEnergy}</span></div>
                    <button class="shop-btn" onclick="buyUpgrade('energy', ${energyCost})">${energyCost} WP</button>
                </div>
                <button class="modal-close" onclick="closeModal()">Fechar</button>
            `;
        }

        function buyUpgrade(type, cost) {
            if (points >= cost) {
                points -= cost;
                scoreDisplay.innerText = points;
                if (type === 'multitap') tapPower += 1;
                else if (type === 'energy') {
                    maxEnergy += 50;
                    energy = maxEnergy;
                    energyBar.style.width = '100%';
                    energyText.innerText = `${energy} / ${maxEnergy}`;
                }
                syncScoreToCloud();
                renderShopModal(document.getElementById('modal-body-content'));
            } else {
                alert("Pontos insuficientes!");
            }
        }

        async function renderRankingModal(container) {
            container.innerHTML = `<h3 style="color: #d8b4fe; font-size: 16px;">🏆 Top 10 Global</h3><p style="font-size:11px; color:#9ca3af;">A carregar...</p>`;
            const { data: topPlayers } = await supabaseClient
                .from('players')
                .select('username, score')
                .order('score', { ascending: false })
                .limit(10);

            let html = `
                <h3 style="margin-top: 0; color: #d8b4fe; font-size: 16px;">🏆 Top 10 Global</h3>
                <p style="font-size: 10px; color: #fbbf24; background: rgba(251, 191, 36, 0.1); border: 1px solid rgba(251, 191, 36, 0.2); padding: 6px; border-radius: 6px; margin-bottom: 10px;">
                    💡 Quem ficar no <strong>Top 10 semanal</strong> ganha dinheiro, e se correr bem passa a ser diário! 🚀
                </p>
            `;
            
            if (topPlayers && topPlayers.length > 0) {
                topPlayers.forEach((p, index) => {
                    let medal = index === 0 ? '🥇' : (index === 1 ? '🥈' : (index === 2 ? '🥉' : `#${index+1}`));
                    html += `<div class="ranking-row"><span>${medal} <strong>${p.username || 'Anónimo'}</strong></span><span style="color: #a78bfa; font-weight: bold;">${p.score} WP</span></div>`;
                });
            } else {
                html += `<p style="font-size: 11px;">Ainda sem registos.</p>`;
            }
            html += `<button class="modal-close" onclick="closeModal()">Fechar</button>`;
            container.innerHTML = html;
        }

        function closeModal() {
            document.getElementById('game-modal').classList.remove('open');
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.getElementById('nav-waifu').classList.add('active');
        }
    </script>
</body>
</html>
