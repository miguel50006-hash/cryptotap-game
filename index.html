<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Tap Game</title>
    <!-- Supabase Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #38bdf8; }
        .tap-btn {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border: none;
            border-radius: 50%;
            width: 150px;
            height: 150px;
            font-size: 24px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4);
            margin: 20px auto;
            transition: transform 0.1s ease;
        }
        .tap-btn:active { transform: scale(0.95); }
        .score-display { font-size: 32px; margin: 15px 0; font-weight: bold; }
        .leaderboard {
            max-width: 400px;
            margin: 30px auto;
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .leaderboard h3 { margin-top: 0; color: #facc15; }
        .lb-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid #334155;
        }
        .lb-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <h1>Crypto Tap</h1>
    <div class="score-display">Score: <span id="score">0</span></div>
    
    <button class="tap-btn" onclick="tap()">TAP!</button>

    <div class="leaderboard">
        <h3>🏆 Top Global</h3>
        <div id="lb-list">A carregar ranking...</div>
    </div>

    <script>
        // Configuração do Supabase
        const SUPABASE_URL = 'https://stbfgbquhtnxiizmwqzp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_LRJvCKIncO1YpBfi-bI_Pw_D_9WmU74';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Dados simulados do jogador (substituir pelos dados reais do Telegram WebApp se aplicável)
        const player = {
            telegram_id: 'user_' + Math.floor(Math.random() * 100000),
            username: 'CryptoPlayer_' + Math.floor(Math.random() * 1000)
        };

        let score = 0;

        async function tap() {
            score += 1;
            document.getElementById('score').innerText = score;
            
            // Atualiza direto na tabela 'players'
            const { error } = await supabaseClient
                .from('players')
                .upsert({ 
                    telegram_id: player.telegram_id, 
                    username: player.username, 
                    score: score 
                }, { onConflict: 'telegram_id' });

            if (error) {
                console.error('Erro ao guardar score:', error.message);
            } else {
                fetchLeaderboard();
            }
        }

        async function fetchLeaderboard() {
            const { data, error } = await supabaseClient
                .from('players')
                .select('username, score')
                .order('score', { ascending: false })
                .limit(10);

            const lbList = document.getElementById('lb-list');
            if (error) {
                lbList.innerHTML = 'Erro ao carregar ranking.';
                console.error(error);
                return;
            }

            if (!data || data.length === 0) {
                lbList.innerHTML = 'Ainda sem pontuações.';
                return;
            }

            lbList.innerHTML = data.map((p, index) => `
                <div class="lb-item">
                    <span>#${index + 1} ${p.username}</span>
                    <span><strong>${p.score}</strong></span>
                </div>
            `).join('');
        }

        // Carrega o ranking assim que a página abre
        fetchLeaderboard();
    </script>
</body>
</html>
